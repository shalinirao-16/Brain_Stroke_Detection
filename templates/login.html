<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Stroke Predictor</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
    }

    /* Login Card */
    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      width: 400px;
      padding: 50px 30px;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }

    .login-card h2 {
      margin-bottom: 30px;
      color: #004080;
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Input Fields */
    .input-box {
      position: relative;
      margin-bottom: 25px;
    }

    .input-box i {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: #888;
      font-size: 18px;
    }

    .input-box input {
      width: 100%;
      padding: 14px 15px 14px 45px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    .input-box input:focus {
      border: 2px solid #004080;
    }

    /* Login Button */
    .login-card button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #004080;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.3s;
    }

    .login-card button:hover {
      background: #003366;
      transform: translateY(-2px);
    }

    /* Flash message */
    .flash {
      margin-bottom: 15px;
      color: #d8000c;
      font-weight: 500;
      font-size: 14px;
    }

    /* Small text */
    .login-card .small {
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }

    /* Fade-in animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2><i class="fa-solid fa-user-shield"></i> Login</h2>

    <!-- Flash message for invalid login -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="input-box">
        <i class="fa-solid fa-user"></i>
        <input type="text" name="username" placeholder="Username" required>
      </div>
      <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input type="password" name="password" placeholder="Password" required>
      </div>
      <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
    </form>

    <p class="small">Use <b>admin / admin</b> to log in</p>
  </div>
</body>
</html>
